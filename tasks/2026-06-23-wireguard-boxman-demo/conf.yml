---
# wireguard-boxman-demo box
#
# Layout:
#
#   wireguard_demo
#     wg_server -- nat1  (192.168.100.0/24, libvirt NAT)   <- SSH access + WireGuard listen port
#               -- mgmt  (10.1.30.0/24,  libvirt route)    <- tunnel target subnet, no DHCP
#     wg_client -- nat1  (same NAT bridge)
#
# After `boxman up` and role deployment:
#   wg_client -> WireGuard tunnel -> 10.1.30.10 (wg_server's mgmt IP)
#
# mgmt NIC has no DHCP; the test configures 10.1.30.10/24 on wg_server via SSH
# before running the wireguard_server role.

version: '1.0'
project: wireguard_boxman_demo

provider:
  libvirt:
    uri: qemu:///system
    use_sudo: True
    virt_install_cmd: '/bin/python3 /usr/bin/virt-install'
    virt_clone_cmd: '/bin/python3 /usr/bin/virt-clone'
    virsh_cmd: '/usr/bin/virsh'
    verbose: True

templates:
  ubuntu_24_04_base:
    name: ubuntu-24.04-wg-demo-template
    image:
      uri: http://cloud-images-archive.ubuntu.com/releases/noble/release-20240423/ubuntu-24.04-server-cloudimg-amd64.img
      checksum: sha256:32a9d30d18803da72f5936cf2b7b9efcb4d0bb63c67933f17e3bdfd1751de3f3
    disk_size: 20G
    os_variant: ubuntu24.04
    memory: 1024
    vcpus: 1
    cloudinit_done_marker: /var/log/hello-cloudinit.log
    cloudinit: |
      #cloud-config
      hostname: hello-cloudinit
      manage_etc_hosts: true

      network:
        version: 2
        ethernets:
          default:
            match:
              name: "en*"
            dhcp4: true
            dhcp6: false

      users:
        - name: ubuntu
          lock_passwd: false
          groups: [sudo]
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          shell: /bin/bash

      chpasswd:
        expire: false
        list: |
          ubuntu:ubuntu

      ssh_pwauth: true
      package_update: true
      packages:
        - qemu-guest-agent
        - openssh-server
        - iputils-ping

      runcmd:
        - rm -f /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        - rm -f /etc/cloud/cloud.cfg.d/subiquity-disable-cloudinit-networking.cfg
        - systemctl daemon-reload
        - systemctl enable --now qemu-guest-agent
        - netplan generate || true
        - netplan apply || true
        - [ sh, -c, "useradd -N -m -s /bin/bash -G sudo admin" ]
        - [ sh, -c, "echo 'admin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/admin && chmod 0440 /etc/sudoers.d/admin" ]
        - [ sh, -c, "echo 'admin:{{ env('BOXMAN_ADMIN_PASS', default='boxman') }}' | chpasswd" ]
        - truncate -s 0 /etc/machine-id
        - [ sh, -c, "echo ran at $(date -Is) >> /var/log/hello-cloudinit.log" ]

workspace:
  path: ~/workspaces/boxmandev/wireguard-boxman-demo

clusters:
  wireguard_demo:
    base_image: ubuntu-24.04-wg-demo-template
    proxy_host: localhost
    admin_user: admin
    admin_pass: {{ env("BOXMAN_ADMIN_PASS", default="boxman") }}
    admin_key_name: id_ed25519_boxman
    ssh_config: ssh_config

    networks:
      nat1:
        mode: nat
        bridge:
          stp: 'on'
          delay: '0'
        mac: '52:54:00:20:01:01'
        ip:
          address: '192.168.100.1'
          netmask: '255.255.255.0'
          dhcp:
            range:
              start: '192.168.100.2'
              end: '192.168.100.254'
        enable: True
        autostart: True
      mgmt:
        mode: route
        bridge:
          stp: 'on'
          delay: '0'
        mac: '52:54:00:20:01:02'
        ip:
          address: '10.1.30.1'
          netmask: '255.255.255.0'
        enable: True
        autostart: True

    vms:
      wg_server:
        cpus: { sockets: 1, cores: 1, threads: 1 }
        memory: 1024
        network_adapters:
          - name: adapter_1
            link_state: 'up'
            network_source: 'nat1'
          - name: adapter_2
            link_state: 'up'
            network_source: 'mgmt'
      wg_client:
        cpus: { sockets: 1, cores: 1, threads: 1 }
        memory: 1024
        network_adapters:
          - name: adapter_1
            link_state: 'up'
            network_source: 'nat1'

---
# Salt master/minion lab — boxman cluster definition.
#
# Two Ubuntu 24.04 VMs cloned from a single minimal golden template. Salt is NOT
# baked into the template: this boxman version polls the cloud-init "done marker"
# for only 120s (hardcoded) and, on a miss, skips the template shutdown and then
# fails to clone the still-running template. A full Salt apt-install can't finish
# in 120s, so it would race-and-lose that poll. Instead the template stays minimal
# (marker lands in seconds) and Salt is installed POST-PROVISION by ../setup-salt.sh
# over SSH on each running VM (official Broadcom repo, pinned 3008 LTS), which also
# assigns roles (master vs minion).
#
# Intended to run on sc1 (scds001). From the task root:
#   BOXMAN=~/.conda/envs/boxman/bin/boxman ./run.sh up
#   ./run.sh setup       # install Salt + assign roles + start services
version: '1.0'
project: salt-lab

provider:
  libvirt:
    uri: qemu:///system
    use_sudo: True
    virt_install_cmd: '/usr/bin/python /usr/bin/virt-install'
    virt_clone_cmd: '/usr/bin/python /usr/bin/virt-clone'
    virsh_cmd: '/bin/virsh'
    verbose: True

templates:
  salt_base:
    name: ubuntu-24.04-salt-base
    image:
      uri: http://cloud-images-archive.ubuntu.com/releases/noble/release-20240423/ubuntu-24.04-server-cloudimg-amd64.img
      checksum: sha256:32a9d30d18803da72f5936cf2b7b9efcb4d0bb63c67933f17e3bdfd1751de3f3
    disk_size: 20G
    os_variant: ubuntu24.04
    memory: 2048
    vcpus: 2
    # boxman waits (max 120s in this version) for this marker via the guest agent
    # before shutting the template down and cloning. The last runcmd writes it.
    cloudinit_done_marker: /var/log/salt-cloudinit.log
    cloudinit: |
      #cloud-config
      hostname: salt-base
      manage_etc_hosts: true

      network:
        version: 2
        ethernets:
          default:
            match:
              name: "en*"
            dhcp4: true
            dhcp6: false

      users:
        - name: ubuntu
          lock_passwd: false
          groups: [sudo]
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          shell: /bin/bash

      chpasswd:
        expire: false
        list: |
          ubuntu:ubuntu

      ssh_pwauth: true
      package_update: true
      packages:
        - qemu-guest-agent
        - openssh-server

      write_files:
        - path: /etc/systemd/system/systemd-networkd-wait-online.service.d/override.conf
          permissions: "0644"
          content: |
            [Service]
            ExecStart=
            ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any

      runcmd:
        - rm -f /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        - rm -f /etc/cloud/cloud.cfg.d/subiquity-disable-cloudinit-networking.cfg
        - systemctl daemon-reload
        - systemctl enable --now qemu-guest-agent
        - netplan generate || true
        - netplan apply || true
        - dhclient -v || true
        # admin user (used by boxman for ssh/ansible)
        - [ sh, -c, "id admin >/dev/null 2>&1 || useradd -m -d /admin -s /bin/bash -g admin -G sudo admin" ]
        - [ sh, -c, "echo 'admin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/admin" ]
        - [ sh, -c, "chmod 0440 /etc/sudoers.d/admin" ]
        - [ sh, -c, "echo 'admin:{{ env("BOXMAN_ADMIN_PASS", default="boxman") }}' | chpasswd" ]
        - [ sh, -c, "mkdir -p /admin/.ssh && chmod 700 /admin/.ssh && chown -R admin:admin /admin /admin/.ssh" ]
        # Reset machine-id so every clone regenerates a UNIQUE one at first boot.
        # Otherwise all clones share the template's machine-id, systemd-networkd
        # derives the same DHCP DUID from it, and they collide on a single IP.
        - truncate -s 0 /etc/machine-id
        - [ sh, -c, "rm -f /var/lib/dbus/machine-id && ln -s /etc/machine-id /var/lib/dbus/machine-id" ]
        # Last step: write the done-marker boxman waits on.
        - [ sh, -c, "echo \"salt-base ready $(date -Is)\" >> /var/log/salt-cloudinit.log" ]

workspace:
  path: ~/workspaces/salt-lab

clusters:
  cluster_1:
    base_image: ubuntu-24.04-salt-base
    proxy_host: localhost
    admin_user: admin
    admin_pass: {{ env("BOXMAN_ADMIN_PASS", default="boxman") }}
    admin_key_name: id_ed25519_boxman    # generated automatically at provisioning time
    ssh_config: ssh_config               # generated automatically at provisioning time

    networks:
      nat1:
        mode: nat
        bridge:
          stp: 'on'
          delay: '0'
        mac: '52:54:00:00:77:01'
        ip:
          address: '192.168.77.1'
          netmask: '255.255.255.0'
          dhcp:
            range:
              start: '192.168.77.2'
              end: '192.168.77.254'
        enable: True
        autostart: True

    vms:
      salt-master:
        hostname: salt-master
        cpus:
          sockets: 1
          cores: 2
          threads: 1
        memory: 2048
        network_adapters:
          - name: adapter_1
            link_state: 'up'
            network_source: 'nat1'
      salt-minion:
        hostname: salt-minion
        cpus:
          sockets: 1
          cores: 2
          threads: 1
        memory: 2048
        network_adapters:
          - name: adapter_1
            link_state: 'up'
            network_source: 'nat1'

---
# pg-ha-boxman-trial box
#
# Layout:
#
#   pg_ha_trial
#     pg1, pg2, pg3 -- nat1 (192.168.101.0/24, libvirt NAT)
#
# Three sibling Postgres/Patroni/etcd nodes on one shared NAT network. No second
# network needed (unlike wireguard-boxman-demo) — the nodes only need to see each
# other and get SSH access, both satisfied by nat1.
#
# Docker + Patroni + etcd are installed/started post-provision by ../setup.sh, not
# baked into cloud-init here — boxman's done-marker poll is a hardcoded ~120s
# (confirmed in saltstack-lab/notes.md); a slow install baked into the template
# races that poll and corrupts the clone. Cloud-init here stays minimal (base
# packages only, including a best-effort docker.io — setup.sh checks and falls
# back to installing it itself if this didn't land in time).

version: '1.0'
project: pg_ha_boxman_trial

provider:
  libvirt:
    uri: qemu:///system
    use_sudo: True
    virt_install_cmd: '/bin/python3 /usr/bin/virt-install'
    virt_clone_cmd: '/bin/python3 /usr/bin/virt-clone'
    virsh_cmd: '/usr/bin/virsh'
    verbose: True

templates:
  ubuntu_24_04_base:
    name: ubuntu-24.04-pg-ha-template
    image:
      uri: http://cloud-images-archive.ubuntu.com/releases/noble/release-20240423/ubuntu-24.04-server-cloudimg-amd64.img
      checksum: sha256:32a9d30d18803da72f5936cf2b7b9efcb4d0bb63c67933f17e3bdfd1751de3f3
    disk_size: 20G
    os_variant: ubuntu24.04
    memory: 1024
    vcpus: 1
    cloudinit_done_marker: /var/log/hello-cloudinit.log
    cloudinit: |
      #cloud-config
      hostname: hello-cloudinit
      manage_etc_hosts: true

      network:
        version: 2
        ethernets:
          default:
            match:
              name: "en*"
            dhcp4: true
            dhcp6: false

      users:
        - name: ubuntu
          lock_passwd: false
          groups: [sudo]
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          shell: /bin/bash

      chpasswd:
        expire: false
        list: |
          ubuntu:ubuntu

      ssh_pwauth: true
      package_update: true
      packages:
        - qemu-guest-agent
        - openssh-server
        - iputils-ping
        - docker.io

      runcmd:
        - rm -f /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        - rm -f /etc/cloud/cloud.cfg.d/subiquity-disable-cloudinit-networking.cfg
        - systemctl daemon-reload
        - systemctl enable --now qemu-guest-agent
        - netplan generate || true
        - netplan apply || true
        - [ sh, -c, "useradd -N -m -s /bin/bash -G sudo admin" ]
        - [ sh, -c, "echo 'admin ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/admin && chmod 0440 /etc/sudoers.d/admin" ]
        - [ sh, -c, "echo 'admin:{{ env('BOXMAN_ADMIN_PASS', default='boxman') }}' | chpasswd" ]
        - truncate -s 0 /etc/machine-id
        - [ sh, -c, "echo ran at $(date -Is) >> /var/log/hello-cloudinit.log" ]

workspace:
  path: ~/workspaces/boxmandev/pg-ha-boxman-trial

clusters:
  pg_ha_trial:
    base_image: ubuntu-24.04-pg-ha-template
    proxy_host: localhost
    admin_user: admin
    admin_pass: {{ env("BOXMAN_ADMIN_PASS", default="boxman") }}
    admin_key_name: id_ed25519_boxman
    ssh_config: ssh_config

    networks:
      nat1:
        mode: nat
        bridge:
          stp: 'on'
          delay: '0'
        mac: '52:54:00:20:02:01'
        ip:
          address: '192.168.101.1'
          netmask: '255.255.255.0'
          dhcp:
            range:
              start: '192.168.101.2'
              end: '192.168.101.254'
        enable: True
        autostart: True

    vms:
      pg1:
        cpus: { sockets: 1, cores: 1, threads: 1 }
        memory: 2048
        network_adapters:
          - name: adapter_1
            link_state: 'up'
            network_source: 'nat1'
      pg2:
        cpus: { sockets: 1, cores: 1, threads: 1 }
        memory: 2048
        network_adapters:
          - name: adapter_1
            link_state: 'up'
            network_source: 'nat1'
      pg3:
        cpus: { sockets: 1, cores: 1, threads: 1 }
        memory: 2048
        network_adapters:
          - name: adapter_1
            link_state: 'up'
            network_source: 'nat1'
